# Macro database for the OpenRAM gf180mcu chip assembly layer.
#
# Two kinds of entries:
#   source: openram  - macros generated by this repo (gf180_work/...)
#   source: pdk      - GlobalFoundries hard SRAM macros from the PDK
#
# Paths may use ${VAR} or ${VAR:-default}.  The PDK path is resolved from
# $PDK_ROOT so a different CIEL/gf180mcu install works without editing this
# file.  Generated macros live in $GF180_WORK (default: <repo>/gf180_work).
#
# ports maps the generic pins used by the generated wrappers to the macro:
#   clk, cs_n, we_n, addr, din, dout, vdd, vss, wmask

macros:
  # ------------------------------------------------------------------
  # Locally generated OpenRAM macros (3.3 V thick/thin-oxide mix)
  # ------------------------------------------------------------------
  gf180_16x8_pdn_pex:
    source: openram
    description: OpenRAM gf180mcu 3.3 V 1RW 16x8 with PDN
    gds: ${GF180_WORK:-/grid/OpenRAM/gf180_work}/gf180_16x8_pdn_pex.gds
    lef: ${GF180_WORK:-/grid/OpenRAM/gf180_work}/gf180_16x8_pdn_pex.lef
    verilog: ${GF180_WORK:-/grid/OpenRAM/gf180_work}/gf180_16x8_pdn_pex.v
    lib: ${GF180_WORK:-/grid/OpenRAM/gf180_work}/gf180_16x8_pdn_pex_TT_3p3V_25C.lib
    lib_note: >-
      Stand-in, not a characterization of this macro GDS.  The OpenRAM PEX
      characterizer does not produce a usable Liberty file for the PDN flow,
      so this file is a relabeled characterized 1RW 3.3 V library (correct
      pin directions, bus types and pg_pins; arcs and internal power are
      inherited from the 16x8 template).  Re-run `sram_char.py` on
      `gf180_16x8_pdn_pex.pex.sp` once fixed and replace this file before
      signoff.
    width_um: 229.04
    height_um: 150.955
    words: 16
    data_width: 8
    addr_width: 4
    ports:
      clk: clk0
      cs_n: csb0
      we_n: web0
      addr: addr0
      din: din0
      dout: dout0
      vdd: vccd1
      vss: vssd1

  gf180_128x32_pdn_pex:
    source: openram
    description: OpenRAM gf180mcu 3.3 V 1RW 128x32 with PDN
    gds: ${GF180_WORK:-/grid/OpenRAM/gf180_work}/gf180_128x32_pdn_pex.gds
    lef: ${GF180_WORK:-/grid/OpenRAM/gf180_work}/gf180_128x32_pdn_pex.lef
    verilog: ${GF180_WORK:-/grid/OpenRAM/gf180_work}/gf180_128x32_pdn_pex.v
    lib: ${GF180_WORK:-/grid/OpenRAM/gf180_work}/gf180_128x32_pdn_pex_TT_3p3V_25C.lib
    lib_note: >-
      Stand-in, not a characterization of this macro GDS.  The OpenRAM PEX
      characterizer does not produce a usable Liberty file for the PDN flow,
      so this file is a relabeled characterized 1RW 3.3 V library (correct
      pin directions, bus types and pg_pins; arcs and internal power are
      inherited from the 128x32 template).  Re-run `sram_char.py` on
      `gf180_128x32_pdn_pex.pex.sp` once fixed and replace this file before
      signoff.
    width_um: 689.08
    height_um: 392.615
    words: 128
    data_width: 32
    addr_width: 7
    ports:
      clk: clk0
      cs_n: csb0
      we_n: web0
      addr: addr0
      din: din0
      dout: dout0
      vdd: vccd1
      vss: vssd1

