# Slot specifications for the OpenRAM gf180mcu chip assembly layer.
# All dimensions are microns, origin at the die bottom-left.
# Slot geometries follow the wafer.space / Efabless Caravel-style MPW
# templates (die size, 442 um core inset, IO budget).

slots:
  1x1:
    description: 3932 x 5122 um MPW slot (full Caravel-size)
    die:
      width: 3932
      height: 5122
    core:
      inset:
        left: 442
        bottom: 442
        right: 442
        top: 442
    io_budget:
      dvdd: 8
      dvss: 10
      input: 12
      bidir: 40
      analog: 2
    reserved_area_um2: 50000

  0p5x1:
    description: 1936 x 5122 um MPW slot (half width)
    die:
      width: 1936
      height: 5122
    core:
      inset:
        left: 442
        bottom: 442
        right: 442
        top: 442
    io_budget:
      dvdd: 8
      dvss: 8
      input: 4
      bidir: 44
      analog: 6
    reserved_area_um2: 40000

  1x0p5:
    description: 3932 x 2531 um MPW slot (half height)
    die:
      width: 3932
      height: 2531
    core:
      inset:
        left: 442
        bottom: 442
        right: 442
        top: 442
    io_budget:
      dvdd: 8
