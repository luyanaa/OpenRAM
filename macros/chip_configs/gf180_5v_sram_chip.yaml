# Example chip: foundry 5 V SRAM hard macros in a 0.5x0.5 MPW slot.
# This exercises the 5 V path (PDK 5V-green SRAM + 5 V SCL/libreLane defaults).
chip:
  name: gf180_5v_sram_chip
  description: Four GF180 5V-green 64x8 hard SRAM macros

slot: 0p5x0p5

memory:
  macro: gf180mcu_fd_ip_sram__sram64x8m8wm1
  count: 4
  arrangement:
    prefer: square

interface:
  scheme: unified_bus
  unified_bus:
    data_width: 8
    output_routing: mux

clock:
  frequency_mhz: 25

power:
  core_voltage: 5.0

halo_um: 10
