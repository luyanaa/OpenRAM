# Example chip: one 128x32 OpenRAM macro array on a full 1x1 MPW slot.
#
#   chip_compiler.py check macros/chip_configs/gf180_128x32_test_chip.yaml
#   chip_compiler.py gen  macros/chip_configs/gf180_128x32_test_chip.yaml -o gf180_work/chip_128x32
chip:
  name: gf180_128x32_test
  description: Eight OpenRAM gf180mcu 128x32 macros on a 1x1 slot

slot: 1x1

memory:
  macro: gf180_128x32_pdn_pex
  count: 8
  arrangement:
    prefer: square

interface:
  scheme: unified_bus
  unified_bus:
    data_width: 32
    output_routing: mux
    write_mask: false

clock:
  frequency_mhz: 25

power:
  core_voltage: 3.3

halo_um: 10

# The 2x4 array leaves no routing channel over the macros, and the macro LEF
# stops at Metal4, so the router used the macro Metal5 and crossed the PDN
# straps (38 Metal5 VDD/VSS shorts in run1).  Block the top metal over the
# array while routing.
macro_top_obstruction: true

# Taller array -> more clock insertion delay into the macro inputs; the default
# 0.35 ns hold margin left 2 hold violations (-0.271 ns) after detailed
# routing.
hold_slack_margin_ns: 0.6
